      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PaisaCalc",

    }

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What are the GST slabs in India after GST 2.0?",
          "acceptedAnswer": { "@type": "Answer", "text": "Since 22 September 2025, goods mostly fall in 5% and 18% slabs with a 40% demerit rate for sin and luxury goods. Gold jewellery is 3%." }
        },
        {
          "@type": "Question",
          "name": "What is the difference between CGST, SGST and IGST?",
          "acceptedAnswer": { "@type": "Answer", "text": "Intra-state supplies split into CGST (Centre) plus SGST (State); inter-state supplies use a single IGST collected by the Centre." }
        },
        {
          "@type": "Question",
          "name": "Who must register for GST in India?",
          "acceptedAnswer": { "@type": "Answer", "text": "Goods sellers above ₹40 lakh turnover (₹20 lakh in special states) and service providers above ₹20 lakh, plus inter-state suppliers and e-commerce sellers at any turnover." }
        }
      ]
    }
    </script>
